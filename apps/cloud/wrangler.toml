# Cloudflare Workers deployment for the Token Island cloud (V2 production target).
#
#   pnpm --filter @token-island/cloud worker:migrate   # local D1 (dev)
#   pnpm --filter @token-island/cloud worker:dev       # http://127.0.0.1:47131
#   pnpm --filter @token-island/cloud worker:dry-run   # bundle check (no auth)
#   pnpm --filter @token-island/cloud worker:deploy    # after `wrangler login`
#
# The Node + SQLite runtime (src/node.ts) stays the local/Docker target and
# shares every route, renderer and the CloudStore interface with this Worker.
name = "token-island-cloud"
main = "src/worker.ts"
# The local workerd bundled with wrangler 4.120.1 supports dates up to
# 2026-08-11; newer dates make `wrangler dev` fail to boot.
compatibility_date = "2026-08-01"

# Only the pixel fonts + their OFL licenses are static: every SVG/HTML response
# is rendered by the Worker (and cached at the edge via Cache-Control).
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "token-island-cloud"
database_id = "00000000-0000-0000-0000-000000000000" # replace: `wrangler d1 create token-island-cloud`
migrations_dir = "migrations"

[vars]
# Registration is open by default for local dev; set a Worker secret
# (TOKEN_ISLAND_ADMIN_TOKEN) to require an admin bearer token in production.
TOKEN_ISLAND_ALLOW_REGISTER = "1"
# GitHub OAuth App Client ID (enable "Device Flow" in GitHub OAuth App settings):
# GITHUB_CLIENT_ID = "Iv23li..."
# Absolute base URL used in generated badge/embed snippets (optional).
# TOKEN_ISLAND_PUBLIC_URL = "https://token-island.example.com"

[observability]
enabled = true
