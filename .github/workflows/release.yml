name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.4.0 or v0.4.0-beta.1)'
        required: true
        type: string
      runner:
        description: 'GitHub runner label for macOS build'
        required: false
        default: 'macos-latest'
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Publish macOS Release
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and validate release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Expected format like v0.4.0 or v0.4.0-beta.1"
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag '$TAG' does not match package.json version '$PKG_VERSION' (expected '$EXPECTED_TAG')."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies & run test suite
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      - name: Validate Apple signing & notarization secrets
        id: signing_check
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGN_ENABLED="false"
          NOTARIZE_ENABLED="false"

          if [[ -n "$CSC_LINK" || -n "$CSC_KEY_PASSWORD" ]]; then
            if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
              echo "::error::Both CSC_LINK and CSC_KEY_PASSWORD must be set together for Developer ID code signing."
              exit 1
            fi
            SIGN_ENABLED="true"
          else
            echo "::warning::CSC_LINK is not set; building ad-hoc unsigned DMG/ZIP artifacts."
          fi

          if [[ -n "$APPLE_ID" || -n "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            if [[ "$SIGN_ENABLED" != "true" ]]; then
              echo "::error::Apple notarization requires CSC_LINK and CSC_KEY_PASSWORD to be configured."
              exit 1
            fi
            if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
              echo "::error::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID (7Z39KUX3QC) must all be set for notarization."
              exit 1
            fi
            NOTARIZE_ENABLED="true"
          fi

          echo "sign=$SIGN_ENABLED" >> "$GITHUB_OUTPUT"
          echo "notarize=$NOTARIZE_ENABLED" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate into ephemeral keychain
        if: steps.signing_check.outputs.sign == 'true'
        id: keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/token-island-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"

          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            TEAM="${APPLE_TEAM_ID:-7Z39KUX3QC}"
            IDENTITY="Developer ID Application: Hanzhen Hong (${TEAM})"
          fi
          echo "Resolved signing identity: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Universal macOS App, DMG & ZIP
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SIGN_IDENTITY: ${{ steps.keychain.outputs.identity || '-' }}
        run: |
          DIST_DIR="release-dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          DMG_PATH="$DIST_DIR/TokenIsland-${VERSION}-universal.dmg"
          ZIP_PATH="$DIST_DIR/TokenIsland-${VERSION}-universal-mac.zip"

          bash apps/island-macos/scripts/package-dmg.sh --universal --output "$DMG_PATH"
          ditto -c -k --sequesterRsrc --keepParent "apps/island-macos/build/TokenIsland.app" "$ZIP_PATH"

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Notarize & staple macOS release artifacts
        if: steps.signing_check.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.meta.outputs.version }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          echo "==> Submitting DMG to Apple Notary Service (Team $APPLE_TEAM_ID)"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "==> Stapling notarization ticket to TokenIsland.app & DMG"
          xcrun stapler staple "apps/island-macos/build/TokenIsland.app"
          xcrun stapler staple "$DMG_PATH"

          # Re-create ZIP from the stapled .app bundle so ZIP installs carry the stapled ticket too
          rm -f "$ZIP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "apps/island-macos/build/TokenIsland.app" "$ZIP_PATH"

          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH" || true

      - name: Generate SHA-256 checksums
        run: |
          (
            cd release-dist
            shasum -a 256 TokenIsland-* > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TokenIsland-${{ steps.meta.outputs.tag }}-macos
          path: release-dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch --tags --force
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "${{ github.sha }}"
            git push origin "$TAG"
          fi

          PREV_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -Fxv "$TAG" | head -n 1 || true)"
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="$TAG"
          fi

          FEATS="$(git log "$RANGE" --pretty=format:'- %s (%h)' --grep='^feat' || true)"
          FIXES="$(git log "$RANGE" --pretty=format:'- %s (%h)' --grep='^fix' || true)"
          OTHERS="$(git log "$RANGE" --pretty=format:'- %s (%h)' --invert-grep --grep='^feat' --grep='^fix' -n 20 || true)"

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Token Island ${TAG}"
            echo ""
            if [[ -n "$FEATS" ]]; then
              echo "### Features"
              echo "$FEATS"
              echo ""
            fi
            if [[ -n "$FIXES" ]]; then
              echo "### Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [[ -n "$OTHERS" ]]; then
              echo "### Changes"
              echo "$OTHERS"
              echo ""
            fi
            echo "### Checksums (\`SHA-256\`)"
            echo '```text'
            cat release-dist/SHA256SUMS.txt
            echo '```'
          } > "$NOTES_FILE"

          PRERELEASE_FLAGS=(--prerelease=false --latest)
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            PRERELEASE_FLAGS=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-dist/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" "${PRERELEASE_FLAGS[@]}"
          else
            gh release create "$TAG" release-dist/* --title "$TAG" --notes-file "$NOTES_FILE" "${PRERELEASE_FLAGS[@]}"
          fi

      - name: Cleanup ephemeral signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/token-island-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
